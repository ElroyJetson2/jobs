<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Incident Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <!-- Login -->
  <div id="loginView" class="max-w-sm mx-auto px-4 py-16">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h1 class="text-xl font-bold text-slate-800 text-center mb-6">Staff Login</h1>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" id="username" value="admin" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-sky-500 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" value="goldcoast2026" required
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-sky-500 outline-none" />
        </div>
        <div id="loginError" class="hidden text-red-600 text-sm"></div>
        <button type="submit" class="w-full bg-sky-600 text-white py-2.5 rounded-lg font-medium hover:bg-sky-700">
          Sign in
        </button>
      </form>
      <p class="text-xs text-slate-400 text-center mt-4">Default: admin / goldcoast2026</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashView" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <h1 class="font-bold text-slate-800">Incident Tracker</h1>
        <div class="flex items-center gap-3">
          <span id="userName" class="text-sm text-slate-500"></span>
          <button onclick="logout()" class="text-sm text-slate-500 hover:text-slate-800">Logout</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
      <!-- Filters -->
      <div class="flex flex-wrap gap-3 mb-5">
        <select id="filterDev" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="">All developments</option>
        </select>
        <select id="filterStatus" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
          <option value="">All statuses</option>
          <option value="submitted">Submitted</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="closed">Closed</option>
        </select>
        <button onclick="loadIncidents()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700">
          Refresh
        </button>
      </div>

      <!-- List -->
      <div id="incidentList" class="space-y-3"></div>
      <p id="emptyMsg" class="hidden text-center text-slate-400 py-12">No incidents found</p>
    </main>
  </div>

  <!-- Update modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-20">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-bold text-slate-800 mb-1">Update Incident</h2>
      <p id="modalRef" class="font-mono text-sm text-slate-500 mb-4"></p>

      <form id="updateForm" class="space-y-4">
        <input type="hidden" id="updRef" />
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
          <select id="updStatus" class="w-full border border-slate-300 rounded-lg px-3 py-2">
            <option value="submitted">Submitted</option>
            <option value="acknowledged">Acknowledged</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Priority</label>
          <select id="updPriority" class="w-full border border-slate-300 rounded-lg px-3 py-2">
            <option value="low">Low</option>
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Projected Finish</label>
          <input type="datetime-local" id="updProjected"
            class="w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Assigned To</label>
          <input type="text" id="updAssigned" placeholder="Staff name"
            class="w-full border border-slate-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Note / Update for customer</label>
          <textarea id="updNote" rows="3" placeholder="What happened / next steps…"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 resize-none"></textarea>
        </div>
        <div id="updError" class="hidden text-red-600 text-sm"></div>
        <div class="flex gap-3 pt-1">
          <button type="button" onclick="closeModal()"
            class="flex-1 border border-slate-300 py-2.5 rounded-lg text-slate-700 hover:bg-slate-50">Cancel</button>
          <button type="submit"
            class="flex-1 bg-sky-600 text-white py-2.5 rounded-lg font-medium hover:bg-sky-700">Save Update</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('gc_token') || '';
    let displayName = localStorage.getItem('gc_name') || '';

    const statusColors = {
      submitted: 'bg-slate-100 text-slate-700',
      acknowledged: 'bg-blue-100 text-blue-700',
      in_progress: 'bg-amber-100 text-amber-800',
      completed: 'bg-emerald-100 text-emerald-700',
      closed: 'bg-slate-200 text-slate-600'
    };
    const statusLabels = {
      submitted: 'Submitted', acknowledged: 'Acknowledged',
      in_progress: 'In Progress', completed: 'Completed', closed: 'Closed'
    };

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso.includes('T') ? iso : iso + 'Z');
      return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    // Auth check on load
    if (token) {
      showDash();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        token = data.token;
        displayName = data.display_name;
        localStorage.setItem('gc_token', token);
        localStorage.setItem('gc_name', displayName);
        showDash();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      }
    });

    function logout() {
      token = '';
      localStorage.removeItem('gc_token');
      localStorage.removeItem('gc_name');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('dashView').classList.add('hidden');
    }

    function showDash() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashView').classList.remove('hidden');
      document.getElementById('userName').textContent = displayName;
      loadIncidents();
    }

    async function loadIncidents() {
      const list = document.getElementById('incidentList');
      const empty = document.getElementById('emptyMsg');
      list.innerHTML = '<p class="text-slate-400 text-center py-8">Loading…</p>';

      const params = new URLSearchParams();
      const dev = document.getElementById('filterDev').value;
      const status = document.getElementById('filterStatus').value;
      if (dev) params.set('development_id', dev);
      if (status) params.set('status', status);

      try {
        const res = await fetch('/api/admin/incidents?' + params, {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Populate development filter once
        const sel = document.getElementById('filterDev');
        if (sel.options.length <= 1 && data.developments) {
          data.developments.forEach(d => {
            const o = document.createElement('option');
            o.value = d.id;
            o.textContent = d.name;
            sel.appendChild(o);
          });
        }

        list.innerHTML = '';
        if (!data.incidents.length) {
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');

        data.incidents.forEach(i => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl border border-slate-200 p-4 hover:shadow-sm transition';
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="font-mono font-semibold text-slate-800"></p>
                <p class="text-sm text-slate-500"></p>
              </div>
              <span class="status-badge px-2.5 py-0.5 rounded-full text-xs font-medium"></span>
            </div>
            <p class="desc text-sm text-slate-700 mt-2 line-clamp-2"></p>
            <div class="flex items-center justify-between mt-3 text-xs text-slate-400">
              <span class="meta"></span>
              <button class="upd-btn text-sky-600 hover:underline font-medium">Update</button>
            </div>
          `;
          card.querySelector('.font-mono').textContent = i.reference;
          card.querySelector('.text-slate-500').textContent = i.development_name + (i.unit ? ' · ' + i.unit : '');
          const badge = card.querySelector('.status-badge');
          badge.textContent = statusLabels[i.status] || i.status;
          badge.className += ' ' + (statusColors[i.status] || '');
          card.querySelector('.desc').textContent = i.description;
          card.querySelector('.meta').textContent = formatDate(i.created_at) + (i.assigned_to ? ' · ' + i.assigned_to : '');
          card.querySelector('.upd-btn').addEventListener('click', () => openModal(i));
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<p class="text-red-500 text-center py-8">${err.message}</p>`;
      }
    }

    function openModal(i) {
      document.getElementById('updRef').value = i.reference;
      document.getElementById('modalRef').textContent = i.reference + ' · ' + i.development_name;
      document.getElementById('updStatus').value = i.status;
      document.getElementById('updPriority').value = i.priority || 'normal';
      document.getElementById('updAssigned').value = i.assigned_to || '';
      document.getElementById('updNote').value = '';
      // Convert projected_finish to datetime-local format
      if (i.projected_finish) {
        const d = new Date(i.projected_finish.includes('T') ? i.projected_finish : i.projected_finish + 'Z');
        document.getElementById('updProjected').value = d.toISOString().slice(0, 16);
      } else {
        document.getElementById('updProjected').value = '';
      }
      document.getElementById('updError').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('updError');
      errEl.classList.add('hidden');

      const projected = document.getElementById('updProjected').value;
      const payload = {
        reference: document.getElementById('updRef').value,
        status: document.getElementById('updStatus').value,
        priority: document.getElementById('updPriority').value,
        assigned_to: document.getElementById('updAssigned').value.trim(),
        note: document.getElementById('updNote').value.trim(),
        projected_finish: projected ? new Date(projected).toISOString() : null
      };

      try {
        const res = await fetch('/api/admin/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Update failed');
        closeModal();
        loadIncidents();
      } catch (ex) {
        errEl.textContent = ex.message;
        errEl.classList.remove('hidden');
      }
    });

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
  </script>
</body>
</html>
