<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Incident – Gold Coast Properties</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-xl mx-auto px-4 py-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Track Your Incident</h1>
      <p class="text-slate-500 mt-1">Enter your reference number</p>
    </div>

    <!-- Lookup form -->
    <form id="lookupForm" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-6 flex gap-3">
      <input type="text" id="refInput" placeholder="e.g. GC-241014-A7K9" required
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 font-mono uppercase focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none"
        style="text-transform: uppercase;" />
      <button type="submit"
        class="bg-sky-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-sky-700 transition">
        Track
      </button>
    </form>

    <div id="error" class="hidden text-red-600 text-sm bg-red-50 rounded-lg px-4 py-3 mb-4"></div>
    <div id="loading" class="hidden text-center text-slate-500 py-8">Loading…</div>

    <!-- Result card -->
    <div id="result" class="hidden space-y-5">
      <!-- Status header -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wide">Reference</p>
            <p id="ref" class="font-mono font-bold text-lg text-slate-800"></p>
          </div>
          <span id="statusBadge" class="px-3 py-1 rounded-full text-sm font-medium"></span>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
          <div>
            <p class="text-slate-400">Development</p>
            <p id="devName" class="font-medium text-slate-700"></p>
          </div>
          <div>
            <p class="text-slate-400">Unit</p>
            <p id="unit" class="font-medium text-slate-700"></p>
          </div>
          <div>
            <p class="text-slate-400">Priority</p>
            <p id="priority" class="font-medium text-slate-700 capitalize"></p>
          </div>
          <div>
            <p class="text-slate-400">Logged</p>
            <p id="created" class="font-medium text-slate-700"></p>
          </div>
        </div>

        <div id="projectedBox" class="hidden mt-4 bg-sky-50 border border-sky-100 rounded-lg px-4 py-3">
          <p class="text-sm text-sky-700">
            <span class="font-medium">Projected finish:</span>
            <span id="projected"></span>
          </p>
        </div>

        <div class="mt-4">
          <p class="text-slate-400 text-sm">Description</p>
          <p id="description" class="text-slate-700 mt-0.5"></p>
        </div>
      </div>

      <!-- Timeline -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="font-semibold text-slate-800 mb-4">Progress Timeline</h2>
        <ol id="timeline" class="relative border-l border-slate-200 ml-3 space-y-5"></ol>
      </div>
    </div>

    <p class="text-center text-sm text-slate-400 mt-8">
      <a href="/" class="text-sky-600 hover:underline">Report a new incident</a>
    </p>
  </div>

  <script>
    const statusColors = {
      submitted: 'bg-slate-100 text-slate-700',
      acknowledged: 'bg-blue-100 text-blue-700',
      in_progress: 'bg-amber-100 text-amber-800',
      completed: 'bg-emerald-100 text-emerald-700',
      closed: 'bg-slate-200 text-slate-600'
    };

    const statusLabels = {
      submitted: 'Submitted',
      acknowledged: 'Acknowledged',
      in_progress: 'In Progress',
      completed: 'Completed',
      closed: 'Closed'
    };

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso.includes('T') ? iso : iso + 'Z');
      return d.toLocaleString('en-AU', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    async function loadIncident(ref) {
      const errEl = document.getElementById('error');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      errEl.classList.add('hidden');
      result.classList.add('hidden');
      loading.classList.remove('hidden');

      try {
        const res = await fetch(`/api/track?ref=${encodeURIComponent(ref)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Not found');

        const i = data.incident;
        document.getElementById('ref').textContent = i.reference;
        document.getElementById('devName').textContent = i.development_name;
        document.getElementById('unit').textContent = i.unit || '—';
        document.getElementById('priority').textContent = i.priority;
        document.getElementById('created').textContent = formatDate(i.created_at);
        document.getElementById('description').textContent = i.description;

        const badge = document.getElementById('statusBadge');
        badge.textContent = statusLabels[i.status] || i.status;
        badge.className = 'px-3 py-1 rounded-full text-sm font-medium ' + (statusColors[i.status] || statusColors.submitted);

        if (i.projected_finish) {
          document.getElementById('projectedBox').classList.remove('hidden');
          document.getElementById('projected').textContent = formatDate(i.projected_finish);
        } else {
          document.getElementById('projectedBox').classList.add('hidden');
        }

        // Timeline
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        (data.updates || []).forEach(u => {
          const li = document.createElement('li');
          li.className = 'ml-4';
          li.innerHTML = `
            <div class="absolute -left-1.5 mt-1.5 w-3 h-3 rounded-full bg-sky-500 border-2 border-white"></div>
            <time class="text-xs text-slate-400">${formatDate(u.created_at)}</time>
            <p class="text-sm font-medium text-slate-800 mt-0.5">${u.note}</p>
            <p class="text-xs text-slate-400">${u.created_by}${u.status ? ' · ' + (statusLabels[u.status] || u.status) : ''}</p>
          `;
          timeline.appendChild(li);
        });

        result.classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    }

    document.getElementById('lookupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const ref = document.getElementById('refInput').value.trim().toUpperCase();
      if (ref) {
        history.replaceState(null, '', `?ref=${ref}`);
        loadIncident(ref);
      }
    });

    // Auto-load if ?ref= present
    const params = new URLSearchParams(location.search);
    const initialRef = params.get('ref');
    if (initialRef) {
      document.getElementById('refInput').value = initialRef.toUpperCase();
      loadIncident(initialRef);
    }
  </script>
</body>
</html>
