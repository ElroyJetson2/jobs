<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Incident – Elite Resort Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0B1426', light: '#152238', soft: '#1E2F4A' },
            gold: { DEFAULT: '#C9A962', light: '#E8D5A3', muted: '#A68B4B' },
            cream: '#F7F4EF'
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>body{font-family:Inter,system-ui,sans-serif}.font-serif{font-family:'Cormorant Garamond',Georgia,serif}</style>
</head>
<body class="bg-cream min-h-screen text-navy">
  <header class="bg-navy text-white">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full border border-gold/60 flex items-center justify-center text-gold text-sm font-serif font-bold">ER</div>
        <div>
          <div class="font-serif text-lg tracking-wide text-gold leading-tight">Elite Resort Care</div>
          <div class="text-[10px] uppercase tracking-[0.2em] text-white/50">Incident Portal</div>
        </div>
      </a>
      <nav class="flex gap-5 text-sm">
        <a href="/" class="text-white/70 hover:text-gold transition">Report</a>
        <a href="/track.html" class="text-gold border-b border-gold pb-0.5">Track</a>
        <a href="/admin.html" class="text-white/70 hover:text-gold transition">Staff</a>
      </nav>
    </div>
  </header>
  <main class="max-w-xl mx-auto px-4 py-10">
    <div class="text-center mb-8">
      <h1 class="font-serif text-3xl md:text-4xl text-navy font-semibold">Track Your Incident</h1>
      <p class="text-navy/60 mt-2 text-sm">Enter your reference number</p>
    </div>
    <form id="lookupForm" class="bg-white rounded-2xl shadow-sm border border-navy/5 p-5 mb-6 flex gap-3">
      <input type="text" id="refInput" placeholder="e.g. GC-241014-A7K9" required
        class="flex-1 border border-navy/15 rounded-lg px-3.5 py-3 font-mono uppercase bg-cream/50 focus:ring-2 focus:ring-gold/40 focus:border-gold outline-none"
        style="text-transform:uppercase" />
      <button type="submit" class="bg-navy text-gold px-6 py-3 rounded-lg font-medium border border-gold/30 hover:bg-navy-light transition whitespace-nowrap">Track</button>
    </form>
    <div id="error" class="hidden text-red-700 text-sm bg-red-50 border border-red-100 rounded-lg px-4 py-3 mb-4"></div>
    <div id="loading" class="hidden text-center text-navy/40 py-10">Loading…</div>
    <div id="result" class="hidden space-y-5">
      <div class="bg-white rounded-2xl shadow-sm border border-navy/5 p-6">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-[10px] uppercase tracking-wider text-navy/40">Reference</p>
            <p id="ref" class="font-mono font-semibold text-lg text-navy"></p>
          </div>
          <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-medium"></span>
        </div>
        <div class="mt-5 grid grid-cols-2 gap-4 text-sm">
          <div><p class="text-[10px] uppercase tracking-wider text-navy/40">Development</p><p id="devName" class="font-medium text-navy mt-0.5"></p></div>
          <div><p class="text-[10px] uppercase tracking-wider text-navy/40">Unit</p><p id="unit" class="font-medium text-navy mt-0.5"></p></div>
          <div><p class="text-[10px] uppercase tracking-wider text-navy/40">Priority</p><p id="priority" class="font-medium text-navy mt-0.5 capitalize"></p></div>
          <div><p class="text-[10px] uppercase tracking-wider text-navy/40">Logged</p><p id="created" class="font-medium text-navy mt-0.5"></p></div>
        </div>
        <div id="projectedBox" class="hidden mt-5 bg-gold/10 border border-gold/20 rounded-lg px-4 py-3">
          <p class="text-sm text-navy"><span class="font-medium text-gold">Projected finish:</span> <span id="projected"></span></p>
        </div>
        <div class="mt-5"><p class="text-[10px] uppercase tracking-wider text-navy/40">Description</p><p id="description" class="text-navy/80 mt-1"></p></div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-navy/5 p-6">
        <h2 class="font-serif text-xl text-navy mb-5">Progress Timeline</h2>
        <ol id="timeline" class="relative border-l border-gold/30 ml-3 space-y-5"></ol>
      </div>
    </div>
  </main>
  <footer class="border-t border-navy/5 mt-12 py-6 text-center text-xs text-navy/40">© Elite Resort Care · Luxury Property Management · Gold Coast</footer>
  <script>
    const statusColors = { submitted: 'bg-slate-100 text-slate-700', acknowledged: 'bg-blue-50 text-blue-800', in_progress: 'bg-amber-50 text-amber-800', completed: 'bg-emerald-50 text-emerald-800', closed: 'bg-slate-200 text-slate-600' };
    const statusLabels = { submitted: 'Submitted', acknowledged: 'Acknowledged', in_progress: 'In Progress', completed: 'Completed', closed: 'Closed' };
    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso.includes('T') ? iso : iso + 'Z');
      return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    async function loadIncident(ref) {
      const errEl = document.getElementById('error');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');
      errEl.classList.add('hidden');
      result.classList.add('hidden');
      loading.classList.remove('hidden');
      try {
        const res = await fetch('/api/track?ref=' + encodeURIComponent(ref));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Not found');
        const i = data.incident;
        document.getElementById('ref').textContent = i.reference;
        document.getElementById('devName').textContent = i.development_name;
        document.getElementById('unit').textContent = i.unit || '—';
        document.getElementById('priority').textContent = i.priority;
        document.getElementById('created').textContent = formatDate(i.created_at);
        document.getElementById('description').textContent = i.description;
        const badge = document.getElementById('statusBadge');
        badge.textContent = statusLabels[i.status] || i.status;
        badge.className = 'px-3 py-1 rounded-full text-xs font-medium ' + (statusColors[i.status] || statusColors.submitted);
        if (i.projected_finish) {
          document.getElementById('projectedBox').classList.remove('hidden');
          document.getElementById('projected').textContent = formatDate(i.projected_finish);
        } else document.getElementById('projectedBox').classList.add('hidden');
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        (data.updates || []).forEach(u => {
          const li = document.createElement('li');
          li.className = 'ml-4';
          li.innerHTML = '<div class="absolute -left-1.5 mt-1.5 w-3 h-3 rounded-full bg-gold border-2 border-white"></div><time class="text-xs text-navy/40">' + formatDate(u.created_at) + '</time><p class="text-sm font-medium text-navy mt-0.5">' + u.note + '</p><p class="text-xs text-navy/40">' + u.created_by + (u.status ? ' · ' + (statusLabels[u.status] || u.status) : '') + '</p>';
          timeline.appendChild(li);
        });
        result.classList.remove('hidden');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally { loading.classList.add('hidden'); }
    }
    document.getElementById('lookupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const ref = document.getElementById('refInput').value.trim().toUpperCase();
      if (ref) { history.replaceState(null, '', '?ref=' + ref); loadIncident(ref); }
    });
    const params = new URLSearchParams(location.search);
    const initialRef = params.get('ref');
    if (initialRef) {
      document.getElementById('refInput').value = initialRef.toUpperCase();
      loadIncident(initialRef);
    }
  </script>
</body>
</html>
